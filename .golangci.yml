# DO NOT EDIT THIS FILE WITHOUT PERMISSION
version: "2"

run:
  tests: true
  allow-parallel-runners: true
linters:
  default: all
  exclusions:
    paths:
      - .github
    rules:
      - path: _test\.go
        linters:
          - funlen
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/KEINOS/go-todotxt/todo # For texternal usage in tests
            - github.com/stretchr/testify # For readable testing purposes
            - github.com/pkg/errors
    varnamelen:
      # Ignore "ok" variables that hold the bool return value of a type assertion. (defaults to false)
      ignore-type-assert-ok: true
      # Ignore "ok" variables that hold the bool return value of a map index. (defaults to false)
      ignore-map-index-ok: true
      # Ignore "ok" variables that hold the bool return value of a channel receive. (defaults to false)
      ignore-chan-recv-ok: true
      # Optional list of variable names that should be ignored completely. (defaults to empty list)
      ignore-names:
        - err
        - e
        - t
        - tt
        - i
        - ii
        - j
        - jj
        - p
  disable:
    # Disabled due to wsl deprecation and new wsl_v5
    - wsl
    # Disabled due to testing private function purpose
    - testpackage
    # Disabled due to global variables for package-level settings
    - gochecknoglobals
